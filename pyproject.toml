[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "harness-evo"
version = "0.2.0"
description = "Agent Harness Evolution: live nudges, PR-time grading and measured harness improvement for coding agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
model = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
harness-evo = "harness_evo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent-harness-evolution/scripts/harness_evo"]

# A wheel install has no source tree, so the skill's data files ship inside the package
# (paths.skill_root() looks for harness_evo/_skill when the source tree is absent).
[tool.hatch.build.targets.wheel.force-include]
"agent-harness-evolution/config" = "harness_evo/_skill/config"
"agent-harness-evolution/hooks" = "harness_evo/_skill/hooks"
"agent-harness-evolution/evals" = "harness_evo/_skill/evals"
"agent-harness-evolution/analysis" = "harness_evo/_skill/analysis"
"agent-harness-evolution/interventions" = "harness_evo/_skill/interventions"
"agent-harness-evolution/reports" = "harness_evo/_skill/reports"
"agent-harness-evolution/ci" = "harness_evo/_skill/ci"
"agent-harness-evolution/bin" = "harness_evo/_skill/bin"
"agent-harness-evolution/skills" = "harness_evo/_skill/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: hook latency budget tests"]
addopts = "-q"

[tool.coverage.run]
omit = ["*/harness_evo/_vendor/*"]   # vendored PyYAML is third-party code
